<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Viva Energy — test</title>
  <style>
    :root { --ink: #140e0c; --amber: #ffb15a; --paper: #f6efe6; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--ink); color: var(--paper); }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; }
    .bar {
      position: fixed; z-index: 6; top: 0; left: 0; right: 0;
      display: flex; justify-content: space-between; align-items: center;
      padding: 18px 28px; font-size: 12px; letter-spacing: .2em; text-transform: uppercase;
    }
    .bar a { text-decoration: none; }
    .pin { height: 320vh; }
    .stage {
      position: sticky; top: 0; height: 100vh; height: 100svh; overflow: hidden;
      background: var(--ink);
    }
    .word {
      position: absolute; left: 4vw; right: 28vw; top: 16vh;
      font-weight: 650; letter-spacing: -.055em; line-height: .84;
      font-size: clamp(4.4rem, 12vw, 11rem);
      margin: 0;
    }
    .word em { font-style: italic; font-weight: 450; color: var(--amber); }
    .object {
      position: absolute; right: -2vw; bottom: 8vh;
      width: min(48vw, 680px); height: auto;
      pointer-events: none;
      filter: drop-shadow(0 24px 36px rgba(0,0,0,.5));
      will-change: transform;
    }
    .marquee {
      position: absolute; left: 0; right: 0; bottom: 0;
      overflow: hidden; border-top: 1px solid rgba(246,239,230,.16);
      padding: 14px 0; white-space: nowrap;
    }
    .marquee span {
      display: inline-block; padding-left: 100%;
      animation: run 22s linear infinite;
      letter-spacing: .22em; text-transform: uppercase; font-size: 12px;
      color: rgba(246,239,230,.72);
    }
    @keyframes run { to { transform: translateX(-100%); } }
    .road { position: relative; height: 100vh; height: 100svh; overflow: hidden; }
    .road img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .road .word { top: auto; bottom: 14vh; right: 6vw; }
    .end { padding: 12vh 7vw 10vh; }
    .end p { max-width: 36ch; color: rgba(246,239,230,.62); line-height: 1.5; }
    .go {
      display: inline-block; margin-top: 28px; padding: 16px 26px;
      border-radius: 999px; background: var(--amber); color: #1a1006;
      text-decoration: none; font-weight: 700;
    }
    @media (max-width: 800px) {
      .object { width: 78vw; right: -12vw; bottom: 16vh; }
      .word { right: 6vw; font-size: clamp(3.1rem, 15vw, 5.2rem); }
    }
    @media (prefers-reduced-motion: reduce) {
      .marquee span { animation: none; padding-left: 5vw; }
    }
  </style>
</head>
<body>
  <div class="bar">
    <span>Viva Energy</span>
    <a href="https://www.vivaenergy.com.au/">Their site</a>
  </div>
  <section class="pin" id="pin">
    <div class="stage">
      <h1 class="word" id="word">Keep <em>moving.</em></h1>
      <img class="object" id="obj" src="img/flame-object.png" alt="Stand-in flame. Not a Viva Energy mark." />
      <div class="marquee"><span>Fuels · Lubricants · Solvents · Bitumen · Shell · Liberty · Aviation ·&nbsp;</span></div>
    </div>
  </section>
  <section class="road">
    <img src="img/road.jpg" alt="Stand-in of a night road. Not their forecourt." />
    <h2 class="word">The last <em>stop.</em></h2>
  </section>
  <section class="end">
    <p>Pi Studios test. Not their site. Not a quote. The flame is a generated stand-in. Grok Imagine is not on, so this is not a filmed page.</p>
    <a class="go" href="https://www.vivaenergy.com.au/">vivaenergy.com.au</a>
  </section>
  <script>
    (function () {
      var pin = document.getElementById('pin');
      var obj = document.getElementById('obj');
      var word = document.getElementById('word');
      var lines = ['Keep <em>moving.</em>', 'Heat, <em>then fuel.</em>', 'Shell <em>and Liberty.</em>'];
      var y = scrollY, target = scrollY;
      addEventListener('wheel', function (e) {
        if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        e.preventDefault();
        target = Math.min(document.body.scrollHeight - innerHeight, Math.max(0, target + e.deltaY));
      }, { passive: false });
      function frame() {
        y += (target - y) * 0.14;
        if (Math.abs(target - y) > 0.5) scrollTo(0, y);
        var rect = pin.getBoundingClientRect();
        var span = Math.max(1, pin.offsetHeight - innerHeight);
        var p = Math.min(1, Math.max(0, -rect.top / span));
        obj.style.transform = 'translate3d(0,' + (p * -22) + 'vh,0) rotate(' + (p * 16 - 6) + 'deg) scale(' + (1.05 + p * 0.28) + ')';
        var i = p < 0.34 ? 0 : p < 0.68 ? 1 : 2;
        if (word.dataset.i !== String(i)) {
          word.dataset.i = String(i);
          word.innerHTML = lines[i];
        }
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
