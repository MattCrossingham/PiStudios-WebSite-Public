<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Journey — test</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #0c1218; color: #f4f7fb; }
    body { font-family: Georgia, "Times New Roman", serif; }
    a { color: inherit; text-decoration: none; }
    .nav {
      position: fixed; z-index: 5; top: 0; left: 0; right: 0;
      display: flex; justify-content: space-between; padding: 22px 32px;
      font-family: -apple-system, Helvetica, Arial, sans-serif;
      font-size: 13px; letter-spacing: .14em; text-transform: uppercase;
    }
    .pin { height: 420vh; }
    .stage { position: sticky; top: 0; height: 100vh; overflow: hidden; }
    .peak, .cloud {
      position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
      will-change: transform;
    }
    .cloud { object-fit: contain; height: 46vh; top: auto; bottom: 8vh; inset: auto 0 8vh 0; width: 140%; left: -20%; mix-blend-mode: screen; opacity: .85; }
    .cloud.near { bottom: 0; height: 38vh; opacity: .95; }
    .copy {
      position: absolute; left: 8vw; right: 8vw; top: 28vh; z-index: 2;
      font-size: clamp(2.4rem, 5.4vw, 5.2rem); line-height: 1.05; font-weight: 450;
      text-shadow: 0 10px 40px rgba(0,0,0,.35);
    }
    .copy em { font-style: italic; }
    .btn {
      position: absolute; left: 8vw; bottom: 10vh; z-index: 2;
      font-family: -apple-system, Helvetica, Arial, sans-serif;
      border: 1px solid rgba(255,255,255,.7); border-radius: 999px;
      padding: 12px 22px; font-size: 14px;
    }
    .note { padding: 28px 8vw 48px; font-family: -apple-system, Helvetica, Arial, sans-serif; color: rgba(244,247,251,.55); font-size: 13px; }
  </style>
</head>
<body>
  <div class="nav"><span>Journey</span><a href="#end">Contact</a></div>
  <section class="pin" id="pin">
    <div class="stage">
      <img class="peak" id="peak" src="img/peak.jpg" alt="Stand-in mountain. Not iCapital." />
      <img class="cloud" id="back" src="img/clouds.webp" alt="" />
      <img class="cloud near" id="near" src="img/clouds.webp" alt="" />
      <h1 class="copy" id="line">The value is in the <em>climb.</em></h1>
      <a class="btn" href="#end">Contact</a>
    </div>
  </section>
  <p class="note" id="end">Pi Studios test of the scroll. Not iCapital. Not their pictures. Not their words.</p>
  <script>
    (function () {
      var pin = document.getElementById('pin');
      var peak = document.getElementById('peak');
      var back = document.getElementById('back');
      var near = document.getElementById('near');
      var line = document.getElementById('line');
      var lines = [
        'The value is in the <em>climb.</em>',
        'The decisions that matter need <em>height.</em>',
        'No two paths are the <em>same.</em>'
      ];
      var y = scrollY, target = scrollY;
      addEventListener('wheel', function (e) {
        if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        e.preventDefault();
        target = Math.max(0, Math.min(document.body.scrollHeight - innerHeight, target + e.deltaY));
      }, { passive: false });
      function frame(t) {
        y += (target - y) * 0.12;
        if (Math.abs(target - y) > 0.4) scrollTo(0, y);
        var rect = pin.getBoundingClientRect();
        var span = Math.max(1, pin.offsetHeight - innerHeight);
        var p = Math.min(1, Math.max(0, -rect.top / span));
        peak.style.transform = 'scale(' + (1.08 + p * 0.12) + ') translateY(' + (p * -6) + '%)';
        back.style.transform = 'translateX(' + ((t / 80) % 200 - 40) + 'px)';
        near.style.transform = 'translateX(' + ((-t / 50) % 180) + 'px)';
        var i = p < 0.33 ? 0 : p < 0.66 ? 1 : 2;
        if (line.dataset.i !== String(i)) { line.dataset.i = i; line.innerHTML = lines[i]; }
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
